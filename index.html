function showToday(){
  const now=new Date();
  const options={weekday:'short',day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'};
  document.getElementById('todayDate').innerText=now.toLocaleDateString('en-GB',options);
  const startDate=new Date('2025-10-18T00:00:00Z');
  const diffDays=Math.floor((now-startDate)/86400000);
  const index=diffDays%transmissions.length;
  const t=transmissions[index];
  document.getElementById('alienText').innerText=t.alien;
  document.getElementById('decodedMeaning').innerText='Decoded: '+t.decoded;
  countdown();
}

function countdown(){
  const now=new Date();
  const next=new Date();
  next.setUTCHours(24,0,0,0);
  const diff=next-now;
  const h=Math.floor(diff/3600000);
  const m=Math.floor((diff%3600000)/60000);
  const s=Math.floor((diff%60000)/1000);
  document.getElementById('countdown').innerText=`Next transmission in ${h}h ${m}m ${s}s`;
  setTimeout(countdown,1000);
}
